<style>
/* Layout: one working sheet. Sticky bar holds the frame counter and stage tabs; one stage shows at a time; the Record tab is the paper copy. */
:root{
  --bg:#ECEFEB; --surface:#FAFBF9; --field:#FFFFFF; --ink:#141C17; --muted:#58645C;
  --line:#D2D9D3; --line-strong:#9AA79F; --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5; --warn:#A8500B;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1511; --surface:#161D19; --field:#1C2520; --ink:#E5EBE6; --muted:#94A198;
    --line:#2A352E; --line-strong:#5B6A60; --accent:#4FC3A8; --accent-ink:#07140F; --accent-soft:#1B2E27; --warn:#E39A52;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1511; --surface:#161D19; --field:#1C2520; --ink:#E5EBE6; --muted:#94A198;
  --line:#2A352E; --line-strong:#5B6A60; --accent:#4FC3A8; --accent-ink:#07140F; --accent-soft:#1B2E27; --warn:#E39A52;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:780px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;gap:12px;padding-block:12px 10px;flex-wrap:wrap}
.brand{font:700 20px/1 var(--display);letter-spacing:-.01em;margin-right:auto}
.evsel{min-width:0;max-width:100%;flex:1 1 180px;order:3}
.counter{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.counter b{color:var(--ink);font-weight:500}
.meter{height:3px;background:var(--line)}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid transparent;background:none;border-radius:6px;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:72px}
.tab span{font-weight:600;font-size:14px}
.tab small{font:500 11px var(--mono);color:var(--muted);letter-spacing:.04em;min-height:14px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.tab:not([aria-selected="true"]):hover{border-color:var(--line-strong)}

/* panels */
main{padding-block:20px 96px}
h2{font:700 26px/1.15 var(--display);letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 20px;max-width:62ch}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 16px 10px;margin-bottom:14px}
.grp-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:10px 4px}
.grp-h h3{font:600 15px/1.3 var(--display);margin:0;letter-spacing:.005em}
.grp-h .n{font:500 12px var(--mono);color:var(--muted)}
.grp-h .n.full{color:var(--accent)}
.item{display:flex;gap:12px;align-items:flex-start;padding-block:9px;border-top:1px solid var(--line);cursor:pointer;min-height:44px}
.grp-h + .item{border-top:0}
.item input{appearance:none;-webkit-appearance:none;flex:0 0 22px;width:22px;height:22px;margin:1px 0 0;border:1.5px solid var(--line-strong);border-radius:5px;background:var(--field);display:grid;place-content:center;cursor:pointer}
.item input:checked{background:var(--accent);border-color:var(--accent)}
.item input:checked::after{content:"";width:10px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.item span{min-width:0;overflow-wrap:anywhere}
.item input:checked + span{color:var(--muted)}
.item .rm{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 8px;border-radius:4px;font-size:13px}
.item .rm:hover{color:var(--warn)}
.addrow{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.addrow input{flex:1 1 200px;min-width:0}
.sect{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.sect h3{font:600 15px var(--display);margin:0}
.sect p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-bottom:6px}
.f{min-width:0}
.f.wide{grid-column:1 / -1}
.f label{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.f label i{font:500 11px var(--mono);color:var(--muted);font-style:normal;margin-left:4px}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-width:0;background:var(--field);border:1px solid var(--line-strong);border-radius:7px;padding:9px 11px;min-height:42px}
textarea{resize:vertical;line-height:1.45}
::placeholder{color:var(--muted);opacity:.75}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--field);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:42px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line-strong)}
.btn.danger{color:var(--warn);border-color:var(--warn);background:none}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.rec-actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px max(16px,4vw);margin-top:16px}
.copybox{width:100%;min-height:120px;margin-top:10px;font:12px/1.4 var(--mono)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
.saved{font:500 11px var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:18px}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}h2{font-size:23px}}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}

@media print{
  :root:root{--bg:#fff;--surface:#fff;--field:#fff;--ink:#111;--muted:#555;--line:#c9cfca;--accent:#0a5a4c;color-scheme:light}
  body::before,.bar,.nav,.noprint,.toast{display:none!important}
  main{padding:0}
  .wrap{max-width:none;padding:0}
  .paper{border:0;padding:0;margin:0}
}
</style>
</head>

var GROUPS={

/* ---------- logic ---------- */
function vis(c,a){
  if(!c)return true;
  var p=c.split(':'),k=p[0],v=p[1]?p[1].split(','):[];
  switch(k){
    case 'video':return !!a.video;case 'drone':return !!a.drone;case 'second':return !!a.second;
    case 'outdoor':return !!a.outdoor;case 'indoor':return !a.outdoor;
    case 'type':return v.indexOf(a.type||'')>-1;case 'not':return v.indexOf(a.type||'')<0;
  }
  return true;
}
function groupsFor(stage,s){
  var a=s.a,out=[];
  GROUPS[stage].forEach(function(g){
    if(g.dyn==='moments'){
      var T=TYPES[a.type||''];
      out.push({key:'moments',t:'Key moments: '+T.label,items:T.moments.map(function(m,i){return {id:'m:'+(a.type||'x')+':'+i,t:m}})});
    }else if(g.dyn==='custom'){
      out.push({key:'custom',custom:true,t:'Your extra shots',items:s.custom.map(function(x){return {id:x.id,t:x.t,custom:true}})});
    }else{
      var items=g.items.filter(function(it){return vis(it[2],a)}).map(function(it){return {id:it[0],t:it[1]}});
      if(items.length)out.push({key:g.t,t:g.t,items:items});
    }
  });
  return out;
}
function itemsFor(stage,s){var r=[];groupsFor(stage,s).forEach(function(g){r=r.concat(g.items)});return r}

function money(n){return n==null?'':'₹'+n.toLocaleString('en-IN')}
function fmtDate(d){if(!d)return '';var x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function fmtTime(t){if(!t)return '';var p=t.split(':'),h=+p[0],m=p[1];if(isNaN(h))return t;return ((h%12)||12)+':'+m+' '+(h>=12?'pm':'am')}
function hoursBetween(a,b){if(!a||!b)return '';var x=a.split(':'),y=b.split(':');var d=(+y[0]*60+ +y[1])-(+x[0]*60+ +x[1]);if(d<=0)d+=1440;return +(d/60).toFixed(1)}

function F(s,o){

function checklist(stage,s){
  return groupsFor(stage,s).map(function(g){
    var d=0;g.items.forEach(function(x){if(s.c[x.id])d++});

      return '<label class="item"><input type="checkbox" data-c="'+esc(x.id)+'"'+(s.c[x.id]?' checked':'')+'><span>'+esc(x.t)+'</span>'+(x.custom?'<button type="button" class="rm" data-rm="'+esc(x.id)+'" aria-label="Remove '+esc(x.t)+'">Remove</button>':'')+'</label>';

function model(s){

  var cov=['Photo'].concat(a.video?['Video']:[],a.drone?['Drone']:[],a.second?['Second shooter']:[]);
  var hrs=hoursBetween(a.starts,a.ends),fee=num(a.fee),adv=num(a.advance);
  var sec=[];
  sec.push({t:'Event',rows:[['Event',a.eventName],['Type',a.type?T.label:''],['Date',fmtDate(a.date)],
    ['Time',(a.starts||a.ends)?fmtTime(a.starts)+' to '+fmtTime(a.ends)+(hrs?' ('+hrs+' h)':''):''],
    ['Venue',a.venue],['Setting',a.outdoor?'Outdoor':'Indoor'],['Coverage',cov.join(', ')]]});
  sec.push({t:'Client',rows:[['Client',a.clientName],['Phone',a.clientPhone],['Backup contact',a.backup]]});
  sec.push({t:'Deliverables and payment',rows:[['Deliverables',a.deliverables],['Delivery method',a.delivery],
    ['Turnaround',a.turnaround?a.turnaround+' days':''],['Total fee',money(fee)],['Advance received',money(adv)],
    ['Balance due',(fee!=null&&adv!=null)?money(fee-adv):''],['Balance received',money(num(a.balanceIn))]]});
  sec.push({t:'Shot brief',rows:[['Must-have shots and VIPs',a.mustShots],['Restrictions',a.restrictions]]});
  var shots=[];groupsFor('day',s).forEach(function(g){if(g.key==='moments'||g.key==='custom')g.items.forEach(function(x){shots.push([!!s.c[x.id],x.t])})});
  sec.push({t:'Key moments',shots:shots});
  var cam=[['Venue light notes',a.lightNotes],['Shooting mode',a.mode],['ISO limit',a.isoMax?'up to '+a.isoMax:''],['Slowest shutter',a.minShutter],
    ['White balance',a.wb],['File format',a.fileFormat],['Autofocus',a.afMode],['Shutter type',a.shutterMode]];
  if(a.video)cam.push(['Video format',a.videoMode]);
  sec.push({t:'Camera plan',rows:cam});
  sec.push({t:'Day log',rows:[['Arrived',fmtTime(a.arrivedAt)],['Finished',fmtTime(a.leftAt)],['Cards used',a.cardsUsed],['Approx. frames',a.frames],['Issues',a.issues]]});
  var stg=STAGES.map(function(k){var it=itemsFor(k,s),c=counts(k,s);return {name:STAGE_NAME[k],done:c[0],total:c[1],pending:it.filter(function(x){return !s.c[x.id]}).map(function(x){return x.t})}});
  sec.push({t:'Checklist status',stages:stg});

    ['Client rating',a.rating?a.rating+' of 5':''],['Client feedback',a.feedback],['What went well',a.wentWell],['Improve next time',a.improve]]});
  var sub=[a.type?T.label:'',fmtDate(a.date),a.venue].filter(Boolean).join('  ·  ');
  return {studio:store.studio,title:a.eventName||'Untitled event',sub:sub,sec:sec,stamp:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})};
}

function pdfBlob(m){
  var H2C=window.html2canvas,J=window.jspdf&&window.jspdf.jsPDF;
  if(!H2C||!J)return Promise.reject({code:'nolib'});
  var W=794,PW=595.28,PH=841.89,MX=28,MT=28,MB=40,k=(PW-MX*2)/W;
  var root=document.createElement('div');root.id='pdfRoot';root.className='pdfroot';
  root.style.cssText='position:fixed;left:-10000px;top:0;width:'+W+'px;background:#fff;--ink:#141C17;--muted:#58645C;--line:#D2D9D3';
  root.innerHTML='<div class="doc">'+docHTML(m)+'</div>';
  document.body.appendChild(root);
  var cleanup=function(){if(root.parentNode)root.parentNode.removeChild(root)};
  var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  return ready.then(function(){
    var top=root.getBoundingClientRect().top,total=root.scrollHeight,atoms=[];
    root.querySelectorAll('tr, li, .stg').forEach(function(el){atoms.push(el.getBoundingClientRect().bottom-top)});
    var segs=[];root.querySelectorAll('.seg').forEach(function(el){var r=el.getBoundingClientRect();segs.push({t:r.top-top,b:r.bottom-top})});
    var pageH=(PH-MT-MB)/k,cuts=[0];
    while(cuts[cuts.length-1]<total-1){
      var start=cuts[cuts.length-1],limit=start+pageH;
      if(total<=limit){cuts.push(total);break}
      var cut=0;
      for(var q=1;q<segs.length;q++){if(segs[q-1].b<=limit&&segs[q].t>start+pageH*0.2&&segs[q].t>cut)cut=segs[q].t}
      if(!cut)atoms.forEach(function(b){if(b>start+pageH*0.4&&b<=limit&&b>cut)cut=b});
      cuts.push(cut||limit);
    }
    return H2C(root,{scale:2,backgroundColor:'#ffffff',logging:false,windowWidth:W,onclone:function(d){var r=d.getElementById('pdfRoot');if(r){r.style.left='0';r.style.position='absolute'}}}).then(function(canvas){
      var pdf=new J({unit:'pt',format:'a4',orientation:'portrait'}),n=cuts.length-1;
      var safe=function(s){return String(s||'').replace(/[^\x20-\x7E]/g,'')};
      for(var i=0;i<n;i++){
        var sy=Math.round(cuts[i]*2),sh=Math.round((cuts[i+1]-cuts[i])*2);
        var tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=sh;
        var cx=tmp.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,tmp.width,sh);cx.drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
        if(i>0)pdf.addPage();
        pdf.addImage(tmp.toDataURL('image/jpeg',0.92),'JPEG',MX,MT,PW-MX*2,sh/2*k);
        pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(110,120,114);
        pdf.text(safe(m.studio.name)||'Event record',MX,PH-18);
        pdf.text('Page '+(i+1)+' of '+n,PW-MX,PH-18,{align:'right'});
      }
      cleanup();
      return pdf.output('blob');
    });
  }).catch(function(e){cleanup();throw e});
}
function savePDF(){
  var s=S(),m=model(s),name=slug(s.a.eventName)+'-'+(s.a.date||new Date().toISOString().slice(0,10))+'-record.pdf';

  $('#meterFill').style.width=(tt[1]?Math.round(tt[0]/tt[1]*100):0)+'%';
  $('#tabs').innerHTML=TABS.map(function(t){
    var sub='';if(STAGES.indexOf(t[0])>-1){var c=counts(t[0],s);sub=c[0]+'/'+c[1]}
    return '<button type="button" class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'"><span>'+t[1]+'</span><small>'+sub+'</small></button>';
  }).join('');
  var sel=$('#evSel');
  sel.innerHTML=Object.keys(store.recs).map(function(id){return '<option value="'+id+'"'+(id===store.cur?' selected':'')+'>'+esc(evLabel(store.recs[id]))+'</option>'}).join('')+'<option value="__new">+ New event</option>';
  var at=$('#tabs [aria-selected="true"]');if(at&&at.scrollIntoView)try{at.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}
}
function renderPanel(keepScroll){
  $('#panel').innerHTML=panelHTML(S());
  if(!keepScroll)window.scrollTo(0,0);
}
function renderAll(keepScroll){renderBar();renderPanel(keepScroll)}
function refreshCounts(){
  document.querySelectorAll('.grp').forEach(function(g){
    var boxes=g.querySelectorAll('input[data-c]'),d=0;boxes.forEach(function(b){if(b.checked)d++});
    var n=g.querySelector('[data-n]');if(n){n.textContent=d+'/'+boxes.length;n.classList.toggle('full',boxes.length>0&&d===boxes.length)}
  });
  renderBar();
}
function goTo(t){tab=t;renderAll(false)}

/* ---------- events ---------- */
var panel=$('#panel');
function setAnswer(el){
  var s=S(),k=el.dataset.k;s.a[k]=el.value;persist();
  if(k==='eventName'||k==='date'){var o=$('#evSel option[value="'+s.id+'"]');if(o)o.textContent=evLabel(s)}
}
panel.addEventListener('input',function(e){
  var d=e.target.dataset;if(!d)return;
  if(d.k)setAnswer(e.target);
  else if(d.st){store.studio[d.st]=e.target.value;persist()}
});
panel.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.k){setAnswer(el);if(el.dataset.k==='type')renderBar();return}
  if(el.dataset.c){var s=S();if(el.checked)s.c[el.dataset.c]=true;else delete s.c[el.dataset.c];persist();refreshCounts()}
});
function addShot(){
  var inp=$('#newShot');if(!inp)return;var v=inp.value.trim();if(!v)return;
  var s=S();s.custom.push({id:'x'+Date.now().toString(36)+Math.floor(Math.random()*999),t:v});persist();renderAll(true);
  var n=$('#newShot');if(n)n.focus();
}
var delArmed=false,delT;
panel.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  var s=S();
  if(t.dataset.go){goTo(t.dataset.go);return}
  if(t.dataset.tog){var k=t.dataset.tog;s.a[k]=!s.a[k];persist();t.setAttribute('aria-pressed',String(!!s.a[k]));renderBar();return}
  if(t.dataset.rate){s.a.rating=(s.a.rating===t.dataset.rate)?'':t.dataset.rate;persist();panel.querySelectorAll('[data-rate]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.rate===s.a.rating))});return}
  if(t.dataset.rm){e.preventDefault();s.custom=s.custom.filter(function(x){return x.id!==t.dataset.rm});delete s.c[t.dataset.rm];persist();renderAll(true);return}
  if(t.id==='addShot'){addShot();return}
  if(t.id==='btnSave'){saveRecord();return}
  if(t.id==='btnPdf'){savePDF();return}
  if(t.id==='btnCopy'){copyText();return}
  if(t.id==='btnNew'){newRec();tab='details';renderAll(false);toast('New event started');return}
  if(t.id==='btnDel'){
    if(!delArmed){delArmed=true;t.textContent='Click again to delete';clearTimeout(delT);delT=setTimeout(function(){delArmed=false;t.textContent='Delete this event'},4000);return}
    delArmed=false;delete store.recs[s.id];var left=Object.keys(store.recs);
    if(left.length){store.cur=left[left.length-1];persist()}else{newRec()}
    tab='details';renderAll(false);toast('Event deleted');return;
  }
});
panel.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='newShot'){e.preventDefault();addShot()}});
$('#tabs').addEventListener('click',function(e){var t=e.target.closest('.tab');if(t)goTo(t.dataset.tab)});
$('#evSel').addEventListener('change',function(e){
  if(e.target.value==='__new'){newRec();tab='details'}else{store.cur=e.target.value;persist()}
  renderAll(false);
});

renderAll(true);
})();
</script>
</body>
</html>
